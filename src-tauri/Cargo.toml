[package]
name = "free-lib"
version = "1.1.0"
description = "A book reading and collection tracker"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "free_lib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-groups = { path = "groups" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-dialog = "2"
rquickjs = { version = "0.9", features = ["bindgen"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Same version as the one wry already pulls in (see Cargo.lock), so the types match.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_4"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
